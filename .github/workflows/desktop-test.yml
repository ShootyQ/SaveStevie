name: Build desktop test clients

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/desktop-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
            label: Windows-x64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            label: Linux-x64
          - runner: macos-latest
            platform: darwin
            arch: arm64
            label: macOS-Apple-Silicon
          - runner: macos-latest
            platform: darwin
            arch: x64
            label: macOS-Intel
    runs-on: ${{ matrix.runner }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - name: Package offline desktop client
        run: node scripts/build-desktop.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Save-Stevie-Alpha-${{ matrix.label }}
          path: |
            _desktop/clients/*.zip
            _desktop/clients/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
