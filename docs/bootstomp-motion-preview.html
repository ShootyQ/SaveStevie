<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bootstomp · motion preview</title>
<style>body{margin:0;background:#e9e0cd;color:#303a3c;font:16px system-ui}header{padding:14px 20px;background:#fff9ec;border-bottom:2px solid #b6a88d}h1{margin:0 0 8px;font-size:22px}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 14px;border:1px solid #998e78;border-radius:7px;background:#fffdf6;color:inherit;cursor:pointer}button:hover{background:#e3ead8}p{margin:9px 0 0;font-size:13px}main{display:flex;justify-content:center;padding:12px}iframe{border:0;box-shadow:0 4px 20px #554c3525;background:#fff9ec;width:1100px;height:800px;max-width:100%}#status{font-variant-numeric:tabular-nums}</style>
<header><h1>Bootstomp · boots on the paper</h1><nav><button id="intro">Replay entrance</button><button id="walk">Walk → stomp</button><button id="pause">Pause</button><button id="slow">Speed: 1×</button><button id="phone">Phone view</button></nav><p id="status">Loading the actual game artwork…</p><p>Uses the real game renderer and fight. Hold erase on a footprint to counter a stomp. Serve this repository over HTTP to open this preview.</p></header><main><iframe title="Playable Bootstomp animation preview"></iframe></main>
<script>
(async()=>{
 const frame=document.querySelector('iframe'),status=document.querySelector('#status');let g,e,paused=false,speed=1,phone=false,last=0;
 const [html,source]=await Promise.all([fetch('../index.html').then(r=>r.text()),fetch('../game.js').then(r=>r.text())]);
 const code=source.replace('const game = DoodleDefender.createGame();','const game = DoodleDefender.createGame();window.bootPreviewGame=game;'),encoded=btoa(String.fromCharCode(...new TextEncoder().encode(code)));
 const loaded=new Promise(r=>frame.onload=r);frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'"><script>requestAnimationFrame=()=>0;localStorage.setItem("saveStevieMusicMuted","yes");<\/script>').replace('src="game.js"','src="data:text/javascript;base64,'+encoded+'"');await loaded;
 for(let i=0;i<1800;i++){g=frame.contentWindow.bootPreviewGame;if(g?.api.artworkStatus().ready)break;await new Promise(r=>setTimeout(r,50));}
 if(!g?.api.artworkStatus().ready)throw Error('Game artwork did not finish loading.');
 function replay(walk=false){const a=g.api;a.setFirstLessonsEnabled(false);a.setMonsterIntrosEnabled(false);a.setWaveFinaleEnabled(false);a.setSynergyRevealsEnabled(false);a.resetRun({skipIntro:true});g.state.wave=10;a.startWave({skipIntro:true});g.state.timeLeft=0;g.state.enemies=[];g.state.walls=[];g.state.stats.rockRate=0;g.state.player.hp=g.state.player.maxHp=10000;e=a.spawnEnemy(true,100,180);if(walk){a.updateBootstomp(e,a.bootstompSnapshot(e).introDuration+1.45);a.updateBootstomp(e,.81);a.updateBootstomp(e,3.26);a.updateBootstomp(e,.66);}a.draw();}
 document.querySelector('#intro').onclick=()=>replay();document.querySelector('#walk').onclick=()=>replay(true);
 document.querySelector('#pause').onclick=event=>{paused=!paused;event.target.textContent=paused?'Resume':'Pause';};document.querySelector('#slow').onclick=event=>{speed=speed===1?.5:1;event.target.textContent='Speed: '+speed+'×';};
 document.querySelector('#phone').onclick=async event=>{phone=!phone;frame.style.width=phone?'393px':'1100px';frame.style.height=phone?'851px':'800px';event.target.textContent=phone?'Desktop view':'Phone view';await new Promise(r=>setTimeout(r,100));g.api.resize();replay();};
 replay();function animate(now){const dt=Math.min(.025,(now-last)/1000||.016);last=now;if(!paused){g.api.update(dt*speed);g.api.draw();}const s=g.api.bootstompSnapshot(e);status.textContent=s?'Bootstomp: '+s.phase+' · '+(s.motion.feet[0]?.planted?'left planted':'left swinging')+' · '+(s.motion.feet[1]?.planted?'right planted':'right swinging'): 'Replay to start again.';requestAnimationFrame(animate);}requestAnimationFrame(animate);
})().catch(e=>document.querySelector('#status').textContent=e.message);
</script></html>
