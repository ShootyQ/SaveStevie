<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whiteout brush animation study</title>
<style>
body{margin:0;padding:24px;background:#f5efdf;color:#302d35;font:18px system-ui}main{max-width:1000px;margin:auto}h1{color:#315d8c}section{display:flex;flex-wrap:wrap;gap:20px}figure{margin:0;flex:1 1 240px;text-align:center}canvas{width:100%;max-width:300px;aspect-ratio:1;display:block;margin:auto}button{padding:12px 20px;font:inherit;border-radius:12px;border:2px solid #635648;background:#fffaf0;cursor:pointer}p{line-height:1.5}small{display:block;margin-top:24px}
</style><main><h1>Mr. Out’s little brush brigade</h1><p>Marching, caught in glue, and having their whiteout collected. Animation study for the wave-20 White Brothers encounter.</p><button id="pause" aria-pressed="false">Pause animations</button>
<section><figure><canvas width="362" height="362" data-action="march" aria-label="Eight-pose brush marching cycle"></canvas><figcaption>Tiny feet. Big ambitions.</figcaption></figure><figure><canvas width="362" height="362" data-action="glued" aria-label="Brush struggling in glue"></canvas><figcaption>Well, this is sticky.</figcaption></figure><figure><canvas width="362" height="362" data-action="drain" aria-label="Brush drained of whiteout"></canvas><figcaption>Out of whiteout. Out of confidence.</figcaption></figure></section><small>Respects reduced-motion settings. Art and animation timing are separate from future gameplay.</small></main>
<script>
(async()=>{const atlas=await fetch('../assets/art/whiteout-brush-sprites.json').then(r=>r.json()),img=new Image();img.src='../assets/art/'+atlas.image;await img.decode();const canvases=[...document.querySelectorAll('canvas')],reduced=matchMedia('(prefers-reduced-motion: reduce)'),button=document.getElementById('pause');let paused=false,time=0,last=null;
button.onclick=()=>{paused=!paused;button.textContent=paused?'Resume animations':'Pause animations';button.setAttribute('aria-pressed',String(paused));};
function tick(now){const dt=last===null?0:Math.min(.05,(now-last)/1000);last=now;if(!paused&&!document.hidden&&!reduced.matches)time+=dt;
for(const c of canvases){const a=atlas.animations[c.dataset.action];let i=Math.floor(time*a.fps);if(c.dataset.action==='drain')i=Math.max(0,Math.floor((time%3.5-1)*a.fps));const f=a.frames[reduced.matches?a.frames.length-1:a.loop?i%a.frames.length:Math.min(i,a.frames.length-1)],ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,(f%atlas.columns)*atlas.frameWidth,Math.floor(f/atlas.columns)*atlas.frameHeight,atlas.frameWidth,atlas.frameHeight,0,0,c.width,c.height);}requestAnimationFrame(tick);}requestAnimationFrame(tick);
})().catch(()=>{document.querySelector('p').textContent='Could not load brush artwork. Serve this preview from the project web server and try again.';});
</script></html>
