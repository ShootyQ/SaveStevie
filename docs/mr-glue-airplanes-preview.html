<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Glue’s paper airplane workshop</title>
<style>body{margin:0;padding:20px;background:#f5efdf;color:#302d35;font:18px system-ui}main{max-width:1040px;margin:auto}h1{color:#315d8c}p{line-height:1.5}button{font:inherit;padding:12px 20px;background:#fffaf0;border:2px solid #635648;border-radius:12px;cursor:pointer}#scene{display:block;width:100%;aspect-ratio:1000/390;margin:20px 0;background:repeating-linear-gradient(#fffaf0 0 27px,#b9cdd955 28px,#fffaf0 29px)}section{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0;flex:1 1 200px;text-align:center}figure canvas{width:100%;max-width:240px;aspect-ratio:1}small{display:block;margin-top:24px}</style>
<main><h1>Mr. Glue’s paper airplane workshop</h1><p>Rip. Fold. Glue. A deeply irresponsible little flight toward Stevie. A standalone animation preview for the wave-20 encounter.</p><button id="pause" aria-pressed="false">Pause animations</button><canvas id="scene" width="1000" height="390" aria-label="Mr Glue tears up a scrap, folds and glues it, then launches a slowly swaying airplane toward Stevie"></canvas><p id="stage" aria-live="off">Loading artwork…</p><section>
<figure><canvas width="340" height="340" data-action="tear" aria-label="Pulling and tearing paper"></canvas><figcaption>Borrowing the floor.</figcaption></figure><figure><canvas width="340" height="340" data-action="fold" aria-label="Folding a paper airplane"></canvas><figcaption>Very careful creases.</figcaption></figure><figure><canvas width="340" height="340" data-action="glue" aria-label="Squirting glue and releasing the plane"></canvas><figcaption>Entirely too much glue.</figcaption></figure><figure><canvas width="340" height="340" data-action="fly" aria-label="Glue covered airplane banking lazily"></canvas><figcaption>Absolutely no urgency.</figcaption></figure></section><small>Pause and reduced-motion support included. No gameplay, damage, saves or desktop client changes.</small></main>
<script>
(async()=>{const atlas=await fetch('../assets/art/mr-glue-airplanes.json').then(r=>r.json()),image=new Image(),stevie=new Image();image.src='../assets/art/'+atlas.image;stevie.src='../assets/art/stevie.png';await Promise.all([image.decode(),stevie.decode()]);const button=document.getElementById('pause'),reduced=matchMedia('(prefers-reduced-motion: reduce)'),scene=document.getElementById('scene'),ctx=scene.getContext('2d'),cards=[...document.querySelectorAll('[data-action]')];let paused=false,time=0,last=null;
button.onclick=()=>{paused=!paused;button.textContent=paused?'Resume animations':'Pause animations';button.setAttribute('aria-pressed',String(paused));};
function sprite(c,index,x,y,width,height){const r=atlas.frames[index],s=Math.min(width/r.w,height/r.h),w=r.w*s,h=r.h*s;c.drawImage(image,r.x,r.y,r.w,r.h,x+(width-w)/2,y+height-h,w,h);}
function tick(now){const dt=last===null?0:Math.min(.05,(now-last)/1000);last=now;if(!paused&&!document.hidden&&!reduced.matches)time+=dt;
for(const card of cards){const a=atlas.animations[card.dataset.action],t=time%2.8,i=reduced.matches?a.frames.length-1:a.loop?Math.floor(time*a.fps)%a.frames.length:Math.min(a.frames.length-1,Math.floor(t*a.fps)),c=card.getContext('2d');c.clearRect(0,0,340,340);sprite(c,a.frames[i],0,0,340,340);}
ctx.clearRect(0,0,1000,390);const t=reduced.matches?6.6:time%9.5;let f,label;if(t<1.4){f=Math.min(3,Math.floor(t/1.4*4));label='Tear up a little scrap…';}else if(t<3.2){f=4+Math.min(3,Math.floor((t-1.4)/1.8*4));label='Fold it. Check it. Fold it again.';}else if(t<4.8){f=8+Math.min(3,Math.floor((t-3.2)/1.6*4));label='A generous helping of glue.';}else{f=7;label='Incoming… eventually.';}
sprite(ctx,f,20,45,280,300);const sw=110,sh=sw*stevie.naturalHeight/stevie.naturalWidth;ctx.drawImage(stevie,850,345-sh,sw,sh);
if(t>=4.8&&t<8.8){const u=(t-4.8)/4;ctx.save();ctx.translate(285+u*530,150+Math.sin(u*Math.PI*3)*24+u*50);ctx.rotate(Math.sin(u*Math.PI*3)*.1);sprite(ctx,12+Math.floor((t-4.8)*4)%4,-75,-55,150,110);ctx.restore();}
document.getElementById('stage').textContent=label;requestAnimationFrame(tick);}requestAnimationFrame(tick);
})().catch(()=>{document.getElementById('stage').textContent='Could not load the animation. Serve this preview from the project web server.';});
</script></html>
